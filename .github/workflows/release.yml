# Tag v* → build macOS (universal) and Windows x64, zip each with the licence
# and README, and attach to a GitHub release. Modeled on the fleet's plugin
# workflows minus the NSIS wrap: oxbow is a console app with a web control
# page, so a zip is the right shape until it grows a tray shell build.

name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macos-universal
          - os: windows-latest
            name: windows-x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        shell: bash
        run: |
          EXTRA=""
          # Must be set at configure time or "universal" ships arm64-only.
          [[ "${{ matrix.name }}" == macos-* ]] && EXTRA='-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release $EXTRA

      - name: Build
        run: cmake --build build --config Release

      - name: Verify architectures (macOS)
        if: startsWith(matrix.name, 'macos')
        run: lipo -archs build/oxbow | grep -q "x86_64 arm64" || { lipo -archs build/oxbow; exit 1; }

      - name: Package
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          STAGE="oxbow-$VERSION-${{ matrix.name }}"
          mkdir "$STAGE"
          if [[ -f build/Release/oxbow.exe ]]; then
            cp build/Release/oxbow.exe "$STAGE/"
          else
            cp build/oxbow "$STAGE/"
          fi
          cp README.md LICENSE "$STAGE/"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            7z a "$STAGE.zip" "$STAGE"
          else
            zip -r "$STAGE.zip" "$STAGE"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: oxbow-${{ matrix.name }}
          path: oxbow-*.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: oxbow-*.zip
